<style>.fp .mdr-req{margin-top:14px;background:#fff;border:1.5px solid rgba(161,7,40,.25);border-radius:16px;padding:12px 16px;font-size:.95rem;line-height:1.5;max-width:560px;color:#3B1216}.fp .mdr-req b{color:#A10728}.mdr-req-top{display:block;margin:8px auto 0;max-width:640px;font-size:.85rem;line-height:1.45;opacity:.95}</style>
<script>
(function(){
 var fp=document.querySelector('.fp'); if(!fp||fp.getAttribute('data-req')) return; fp.setAttribute('data-req','1');
 var req='<b>Ce cumperi:</b> un sistem de editare cu AI pe care il instalezi, plus un curs video in romana. Se instaleaza pe Mac (macOS 14 sau mai nou) sau Windows 10/11, cu minim 8 GB memorie. Filmezi pe telefon, editezi pe calculator. Motorul costa 127 € o singura data. Ai nevoie si de un abonament platit Claude sau ChatGPT, de la 20 € pe luna, pe care il platesti separat.';
 var row=fp.querySelector('.page-hero .cta-row');
 if(row){var p=document.createElement('p');p.className='mdr-req';p.innerHTML=req;row.parentNode.insertBefore(p,row.nextSibling);}
 fp.querySelectorAll('h3').forEach(function(h){ if(/abonament/i.test(h.textContent)&&/Fără|Fara/i.test(h.textContent)){ h.innerHTML='Platesti <em>o singura data</em>'; var c=h.parentNode.querySelector('p:not(.label)'); if(c) c.textContent='Motorul, cursul si actualizarile gratuite raman ale tale. Abonamentul Claude sau ChatGPT il platesti separat.'; } });
 var n=0; function later(){ var done=0;
  var top=document.getElementById('mdr-close');
  if(top&&!top.querySelector('.mdr-req-top')){var a=top.querySelector('a[href*="oVEQCkep"]'); if(a){var t=document.createElement('small');t.className='mdr-req-top';t.textContent='Sistem de editare cu AI + curs video in romana. Se instaleaza pe Mac sau Windows. 127 \u20ac o singura data; abonamentul AI necesar se plateste separat.';a.parentNode.insertBefore(t,a.nextSibling);}}
  if(top||Date.now()>Date.UTC(2026,10,3,17,0,0)) done++;
  var demo=document.getElementById('demo'), hero=fp.querySelector('.page-hero');
  if(demo&&hero){ if(hero.nextSibling!==demo) hero.parentNode.insertBefore(demo,hero.nextSibling); done++; }
  if(done<2&&n++<60) setTimeout(later,250); }
 later();
})();
</script>
