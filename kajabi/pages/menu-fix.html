<style>.h4 .mbtn{display:none;font-family:var(--lab);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--crimson);background:transparent;border:1.5px solid var(--crimson);border-radius:999px;padding:10px 16px;cursor:pointer}.h4 .mpanel{display:none;border-top:1px solid var(--line);background:var(--white);padding:8px 16px 14px}.h4 .mpanel.open{display:grid;gap:2px}.h4 .mpanel a{display:block;padding:12px 4px;text-decoration:none;color:var(--crimson);font-family:var(--lab);font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line)}.h4 .mpanel a:last-child{border-bottom:0}@media (max-width:900px){.h4 details.menu{display:none!important}.h4 .mbtn{display:inline-block}}</style>
<script>(function(){var r=document.getElementById('h4');if(!r||r.querySelector('.mbtn'))return;var d=r.querySelector('details.menu'),bar=r.querySelector('.top .bar');if(!d||!bar)return;var links=d.querySelector('div').innerHTML;var b=document.createElement('button');b.type='button';b.className='mbtn';b.setAttribute('aria-expanded','false');b.textContent='Meniu';d.parentNode.appendChild(b);var p=document.createElement('nav');p.className='mpanel';p.setAttribute('aria-label','Meniu mobil');p.innerHTML=links;bar.parentNode.insertBefore(p,bar.nextSibling);b.addEventListener('click',function(e){e.preventDefault();var o=p.classList.toggle('open');b.setAttribute('aria-expanded',o?'true':'false');b.textContent=o?'Inchide':'Meniu';});p.querySelectorAll('a').forEach(function(a){a.addEventListener('click',function(){p.classList.remove('open');b.setAttribute('aria-expanded','false');b.textContent='Meniu';});});})();</script>
